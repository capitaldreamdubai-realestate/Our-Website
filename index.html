    <!-- Google Consent Mode v2: must run before GTM. Visitors in the EEA, UK and
         Switzerland start with everything denied until they accept the cookie banner;
         everyone else starts granted. A saved choice (src/lib/analytics/consent.ts)
         is re-applied on every page load. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'granted', ad_user_data: 'granted',
        ad_personalization: 'granted', analytics_storage: 'granted'
      });
      gtag('consent', 'default', {
        ad_storage: 'denied', ad_user_data: 'denied',
        ad_personalization: 'denied', analytics_storage: 'denied',
        wait_for_update: 500,
        region: ['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      try {
        var cdConsent = localStorage.getItem('cd_consent');
        if (cdConsent === 'granted' || cdConsent === 'denied') {
          gtag('consent', 'update', {
            ad_storage: cdConsent, ad_user_data: cdConsent,
            ad_personalization: cdConsent, analytics_storage: cdConsent
          });
        }
      } catch (e) {}
    </script>
